name: Build IRIS Debug APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
      - run: flutter create . --platforms=android --project-name iris_app
      - run: sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle
      - name: Set app display name to I.R.I.S
        run: sed -i 's/android:label="iris_app"/android:label="I.R.I.S"/' android/app/src/main/AndroidManifest.xml
      - name: Add biometric permissions (face/fingerprint unlock)
        run: sed -i '/<application/i\    <uses-permission android:name="android.permission.USE_BIOMETRIC"/>\n    <uses-permission android:name="android.permission.USE_FINGERPRINT"/>' android/app/src/main/AndroidManifest.xml
      - name: Use FlutterFragmentActivity (required by local_auth biometrics)
        run: |
          f=$(grep -rl 'FlutterActivity()' android/app/src/main/kotlin | head -1)
          sed -i 's/import io.flutter.embedding.android.FlutterActivity/import io.flutter.embedding.android.FlutterFragmentActivity/' "$f"
          sed -i 's/: FlutterActivity()/: FlutterFragmentActivity()/' "$f"
      - name: Generate crisp icons and splash assets from the 1024px master
        run: |
          python3 -m pip install --quiet pillow
          python3 tool/make_icons.py
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: dart run flutter_native_splash:create
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: IRIS-Debug-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
