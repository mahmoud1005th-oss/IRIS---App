environment:
  sdk: '>=3.0.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.0.0
  local_auth: ^2.1.6
  flutter_tts: 4.1.0
  speech_to_text: ^7.0.0
