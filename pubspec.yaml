name: iris_app
description: I.R.I.S - Infinity Retinal Intelligence System
version: 3.2.0+6
environment:
  sdk: '>=3.0.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.0.0
  local_auth: ^2.1.6
  flutter_tts: 4.1.0
  speech_to_text: ^7.0.0
  http: ^1.1.0
  sqflite: ^2.3.0
  path: ^1.8.3
  provider: ^6.1.1
  workmanager: ^0.5.2
  font_awesome_flutter: ^10.8.0
  shared_preferences: ^2.3.2
dev_dependencies:
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.3
flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon_2048.png"
  min_sdk_android: 24
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/adaptive_fg.png"
flutter_native_splash:
  color: "#000000"
  image: assets/icon/splash.png
  android: true
  ios: false
  android_12:
    color: "#000000"
    image: assets/icon/splash_fg.png
