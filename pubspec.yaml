name: iris_app
description: I.R.I.S - Infinity Retinal Intelligence System
version: 1.0.0+1
environment:
  sdk: '>=3.0.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  path: ^1.8.3
  workmanager: ^0.5.2
  flutter_overlay_window: ^0.5.0
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  http: ^1.1.0
  intl: ^0.18.1
dev_dependencies:
  flutter_launcher_icons: ^0.13.1
flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo.png"
